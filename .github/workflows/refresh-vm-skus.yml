name: Refresh VM SKU Data

on:
  schedule:
    - cron: '0 0 1 * *'    # Monthly on the 1st at 00:00 UTC
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify environment
        run: |
          Write-Host "Runner OS: $env:RUNNER_OS"
          pwsh -Version
          az --version 2>&1 | Select-Object -First 3
        shell: pwsh

      - name: Azure Login (OIDC)
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get all Azure regions and target regions from config
        id: regions
        continue-on-error: true
        run: |
          # Read config
          $config = Get-Content "config.json" | ConvertFrom-Json

          # Fetch all physical regions for the map/dropdown (list-locations doesn't use --subscription)
          $regionsJson = az account list-locations --query "[?metadata.regionType=='Physical'].{name:name, displayName:displayName, geographyGroup:metadata.geographyGroup, latitude:metadata.latitude, longitude:metadata.longitude}" -o json
          if ($LASTEXITCODE -ne 0 -or -not $regionsJson) { throw "Azure region list could not be fetched" }
          $allRegions = $regionsJson | ConvertFrom-Json -AsHashtable
          if (-not $allRegions -or $allRegions.Count -eq 0) { throw "Azure region list was empty" }
          $allRegions | ConvertTo-Json -Depth 3 | Set-Content "data/regions.json" -Encoding UTF8
          Write-Host "[OK] Found $($allRegions.Count) physical regions"
          "region_count=$($allRegions.Count)" >> $env:GITHUB_OUTPUT

          # Read target regions from config.json
          $targetRegions = $config.targetRegions
          Write-Host "[OK] Target regions: $($targetRegions.Count) ($($targetRegions.name -join ', '))"
        shell: pwsh

      - name: Fetch SKU data for target regions
        id: fetch
        continue-on-error: true
        run: |
          $config = Get-Content "config.json" | ConvertFrom-Json
          $regions = $config.targetRegions
          $allRegions = Get-Content "data/regions.json" | ConvertFrom-Json -AsHashtable
          $dataDir = "data"
          $successCount = 0
          $failCount = 0
          $availableRegions = @()
          $failedRegions = @()
          $maxRetries = 3

          foreach ($region in $regions) {
            $name = $region.name
            $display = $region.displayName
            Write-Host "Fetching SKUs for $display ($name)..."

            $success = $false
            for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
              try {
                $subId = "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
                $subArgs = if ($subId) { @("--subscription", $subId) } else { @() }
                $raw = az vm list-skus --location $name --resource-type virtualMachines --all @subArgs -o json 2>$null
                if ($LASTEXITCODE -ne 0) { throw "Azure SKU query failed for $name (exit $LASTEXITCODE)" }
                if (-not $raw -or $raw -eq "[]") {
                    Write-Host "  [WARN] No VM SKUs returned for $name — preserving last-known-good data"
                    break
                  }

                # Archive existing data before overwriting
                $existingFile = "$dataDir/$name.json"
                if (Test-Path $existingFile) {
                  try {
                    $existingData = Get-Content $existingFile | ConvertFrom-Json
                    $lastUpdated = $existingData.lastUpdated
                    if ($lastUpdated) {
                      $archiveDate = ([DateTime]$lastUpdated).ToString("yyyy-MM")
                    } else {
                      $archiveDate = (Get-Date).AddMonths(-1).ToString("yyyy-MM")
                    }
                    $historyDir = "$dataDir/history"
                    if (-not (Test-Path $historyDir)) { New-Item -ItemType Directory -Path $historyDir -Force | Out-Null }
                    $archivePath = "$historyDir/$name-$archiveDate.json"
                    if (-not (Test-Path $archivePath)) {
                      Copy-Item $existingFile $archivePath
                      Write-Host "  [OK] Archived previous data to $archivePath"
                    } else {
                      Write-Host "  [INFO] Archive already exists: $archivePath"
                    }
                  } catch {
                    Write-Host "  [WARN] Could not archive previous data: $_"
                  }
                }

                # Save raw and normalize with Python script
                $raw | Set-Content "$dataDir/$name-raw.json" -Encoding UTF8
                python scripts/normalize-skus.py "$dataDir/$name-raw.json" "$dataDir/$name.json" "$display"
                if ($LASTEXITCODE -ne 0) { throw "SKU normalization failed for $name" }

                # Clean up raw file
                Remove-Item "$dataDir/$name-raw.json" -ErrorAction SilentlyContinue

                $successCount++
                $availableRegions += $name
                $success = $true
                break

              } catch {
                Write-Host "  [WARN] Attempt $attempt/$maxRetries failed for $name`: $_"
                Remove-Item "$dataDir/$name-raw.json" -ErrorAction SilentlyContinue
                if ($attempt -lt $maxRetries) {
                  $backoff = $attempt * 10
                  Write-Host "  Retrying in ${backoff}s..."
                  Start-Sleep -Seconds $backoff
                }
              }
            }

            if (-not $success) {
              Write-Host "  [FAIL] Failed for $name after $maxRetries attempts"
              $failCount++
              $failedRegions += $name
            }
          }

          Write-Host "`n[OK] Refreshed $successCount regions, $failCount failed/skipped"

          # Save results for summary step
          "success_count=$successCount" >> $env:GITHUB_OUTPUT
          "fail_count=$failCount" >> $env:GITHUB_OUTPUT
          "available=$($availableRegions -join ',')" >> $env:GITHUB_OUTPUT
          "failed=$($failedRegions -join ',')" >> $env:GITHUB_OUTPUT

        shell: pwsh

      - name: Refresh retirement data
        id: retirements
        continue-on-error: true
        run: |
          pip install requests beautifulsoup4 -q
          python scripts/update-retirements.py
          if ($LASTEXITCODE -ne 0) { throw "Retirement source refresh failed" }
          $retirementData = Get-Content "data/retirements.json" | ConvertFrom-Json
          "entry_count=$($retirementData.retirements.Count)" >> $env:GITHUB_OUTPUT
          Write-Host "[OK] Retirement data refresh complete"
        shell: pwsh

      - name: Fetch pricing data
        id: pricing
        continue-on-error: true
        run: |
          $config = Get-Content "config.json" | ConvertFrom-Json
          $regions = $config.targetRegions
          # The app and Top Trumps consume USD pricing; refreshing only USD reduces API load.
          # PAYG only keeps the monthly refresh within the 6h job limit.
          $currencies = @("USD")
          $successCount = 0
          $failures = @()
          foreach ($currency in $currencies) {
            Write-Host "=== Fetching PAYG pricing in $currency ==="
            foreach ($region in $regions) {
              $name = $region.name
              $dataFile = "data/$name.json"
              $pricingFile = "data/$name-pricing-$currency.json"
              if (-not (Test-Path $dataFile)) {
                $failures += "$name/$currency (VM SKU data unavailable)"
                continue
              }
              try {
                Write-Host "  Fetching pricing for $name ($currency)..."
                python scripts/fetch-pricing.py $dataFile $pricingFile --currency $currency --payg-only
                if ($LASTEXITCODE -ne 0) { throw "Pricing fetch failed (exit $LASTEXITCODE)" }
                $successCount++
              } catch {
                Write-Host "  [WARN] Pricing unavailable for $name/$currency`: $_"
                $failures += "$name/$currency"
              }
            }
          }
          # Write the USD compatibility file consumed by the app and card builder.
          foreach ($region in $regions) {
            $name = $region.name
            $usdFile = "data/$name-pricing-USD.json"
            $compatFile = "data/$name-pricing.json"
            if (Test-Path $usdFile) {
              Copy-Item $usdFile $compatFile -Force
            }
          }
          "success_count=$successCount" >> $env:GITHUB_OUTPUT
          "fail_count=$($failures.Count)" >> $env:GITHUB_OUTPUT
          "failed=$($failures -join ',')" >> $env:GITHUB_OUTPUT
          Write-Host "[INFO] USD pricing data refreshed for $successCount region/USD pairs; $($failures.Count) failed"
        shell: pwsh

      - name: Fetch disk SKU data
        id: disks
        continue-on-error: true
        run: |
          $config = Get-Content "config.json" | ConvertFrom-Json
          $regions = $config.targetRegions
          $subId = "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          $subArgs = if ($subId) { @("--subscription", $subId) } else { @() }
          $successRegions = @()
          $failedRegions = @()
          foreach ($region in $regions) {
            $name = $region.name
            $display = $region.displayName
            try {
              Write-Host "Fetching disk SKUs for $display ($name)..."
              $raw = az vm list-skus --location $name --resource-type disks --all @subArgs -o json 2>$null
              if ($LASTEXITCODE -ne 0 -or -not $raw -or $raw -eq "[]") {
                throw "Azure returned no disk SKU data"
              }
              $rawFile = "data/$name-disks-raw.json"
              $raw | Set-Content $rawFile -Encoding UTF8
              python scripts/normalize-disks.py $rawFile "data/$name-disks.json" "$display"
              if ($LASTEXITCODE -ne 0) { throw "Disk normalization failed" }
              Remove-Item $rawFile -ErrorAction SilentlyContinue
              $successRegions += $name
              Write-Host "  [OK] Disk data saved for $name"
            } catch {
              Remove-Item "data/$name-disks-raw.json" -ErrorAction SilentlyContinue
              $failedRegions += $name
              Write-Host "  [WARN] Disk data unavailable for $name`: $_ (preserving last-known-good data)"
            }
          }
          "success_count=$($successRegions.Count)" >> $env:GITHUB_OUTPUT
          "fail_count=$($failedRegions.Count)" >> $env:GITHUB_OUTPUT
          "failed=$($failedRegions -join ',')" >> $env:GITHUB_OUTPUT
          Write-Host "[INFO] Disk data refreshed for $($successRegions.Count) regions; $($failedRegions.Count) failed"
        shell: pwsh

      - name: Build Top Trumps card deck (data/cards.json)
        id: cards
        continue-on-error: true
        run: |
          python scripts/build-cards.py
          if ($LASTEXITCODE -ne 0) { throw "Top Trumps card generation failed" }
          Write-Host "[OK] Top Trumps cards.json regenerated"
        shell: pwsh

      - name: Record source refresh health
        if: always()
        run: |
          $metadataPath = "data/metadata.json"
          $metadata = if (Test-Path $metadataPath) {
            Get-Content $metadataPath -Raw | ConvertFrom-Json -AsHashtable
          } else {
            @{}
          }
          $config = Get-Content "config.json" -Raw | ConvertFrom-Json
          $expectedRegions = $config.targetRegions.Count
          $now = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

          function Get-SourceStatus($successCount, $failureCount, $expectedCount, $outcome) {
            if ($outcome -eq "failure" -and $successCount -eq 0) { return "unavailable" }
            if ($successCount -eq 0) { return "unavailable" }
            if ($failureCount -gt 0 -or $successCount -lt $expectedCount -or $outcome -eq "failure") { return "partial" }
            return "success"
          }

          function ConvertTo-Count($value) {
            if ($value -match '^\d+$') { return [int]$value }
            return 0
          }

          function Get-PreviousSourceUpdate($metadata, $sourceId, $fallback) {
            $previousSource = $metadata.sourceHealth.sources | Where-Object { $_.id -eq $sourceId } | Select-Object -First 1
            if ($previousSource -and $previousSource.lastSuccessfulUpdate) {
              return $previousSource.lastSuccessfulUpdate
            }
            return $fallback
          }

          $vmSuccess = ConvertTo-Count "${{ steps.fetch.outputs.success_count }}"
          $vmFailed = ConvertTo-Count "${{ steps.fetch.outputs.fail_count }}"
          $diskSuccess = ConvertTo-Count "${{ steps.disks.outputs.success_count }}"
          $diskFailed = ConvertTo-Count "${{ steps.disks.outputs.fail_count }}"
          $pricingSuccess = ConvertTo-Count "${{ steps.pricing.outputs.success_count }}"
          $pricingFailed = ConvertTo-Count "${{ steps.pricing.outputs.fail_count }}"
          $regionsCount = ConvertTo-Count "${{ steps.regions.outputs.region_count }}"

          $retirementData = if (Test-Path "data/retirements.json") { Get-Content "data/retirements.json" -Raw | ConvertFrom-Json } else { $null }
          $retirementCount = if ($retirementData) { $retirementData.retirements.Count } else { 0 }
          $retirementOutcome = "${{ steps.retirements.outcome }}"
          $regionsOutcome = "${{ steps.regions.outcome }}"
          $vmOutcome = "${{ steps.fetch.outcome }}"
          $diskOutcome = "${{ steps.disks.outcome }}"
          $pricingOutcome = "${{ steps.pricing.outcome }}"
          $cardsOutcome = "${{ steps.cards.outcome }}"

          $sources = @(
            @{
              id = "regions"; label = "Azure region list"
              status = Get-SourceStatus $regionsCount 0 1 $regionsOutcome
              checkedAt = $now
              lastSuccessfulUpdate = if ($regionsCount -gt 0 -and $regionsOutcome -eq "success") { $now } else { Get-PreviousSourceUpdate $metadata "regions" $metadata.lastUpdated }
              summary = "$regionsCount physical regions returned"
              failures = @()
            },
            @{
              id = "vmSkus"; label = "VM SKU data"
              status = Get-SourceStatus $vmSuccess $vmFailed $expectedRegions $vmOutcome
              checkedAt = $now
              lastSuccessfulUpdate = if ($vmSuccess -eq $expectedRegions -and $vmFailed -eq 0 -and $vmOutcome -eq "success") { $now } else { Get-PreviousSourceUpdate $metadata "vmSkus" $metadata.lastUpdated }
              summary = "$vmSuccess of $expectedRegions regions refreshed"
              failures = @("${{ steps.fetch.outputs.failed }}".Split(',', [System.StringSplitOptions]::RemoveEmptyEntries))
            },
            @{
              id = "disks"; label = "Disk SKU data"
              status = Get-SourceStatus $diskSuccess $diskFailed $expectedRegions $diskOutcome
              checkedAt = $now
              lastSuccessfulUpdate = if ($diskSuccess -eq $expectedRegions -and $diskFailed -eq 0 -and $diskOutcome -eq "success") { $now } else { Get-PreviousSourceUpdate $metadata "disks" $metadata.lastUpdated }
              summary = "$diskSuccess of $expectedRegions regions refreshed"
              failures = @("${{ steps.disks.outputs.failed }}".Split(',', [System.StringSplitOptions]::RemoveEmptyEntries))
            },
            @{
              id = "pricing"; label = "Pricing data"
              status = Get-SourceStatus $pricingSuccess $pricingFailed $expectedRegions $pricingOutcome
              checkedAt = $now
              lastSuccessfulUpdate = if ($pricingSuccess -eq $expectedRegions -and $pricingFailed -eq 0 -and $pricingOutcome -eq "success") { $now } else { Get-PreviousSourceUpdate $metadata "pricing" $metadata.lastUpdated }
              summary = "$pricingSuccess of $expectedRegions regions refreshed (USD)"
              failures = @("${{ steps.pricing.outputs.failed }}".Split(',', [System.StringSplitOptions]::RemoveEmptyEntries))
            },
            @{
              id = "retirements"; label = "Retirement alerts"
              status = if ($retirementOutcome -eq "success" -and $retirementCount -gt 0) { "success" } else { "unavailable" }
              checkedAt = $now
              lastSuccessfulUpdate = if ($retirementOutcome -eq "success" -and $retirementData) { $retirementData.lastUpdated } else { Get-PreviousSourceUpdate $metadata "retirements" $(if ($retirementData) { $retirementData.lastUpdated } else { "" }) }
              summary = if ($retirementOutcome -eq "success") { "$retirementCount family records refreshed" } else { "Refresh failed; last-known-good data retained" }
              failures = if ($retirementOutcome -eq "success") { @() } else { @("Microsoft Learn retirement source") }
            },
            @{
              id = "history"; label = "History snapshots"
              status = Get-SourceStatus $vmSuccess $vmFailed $expectedRegions $vmOutcome
              checkedAt = $now
              lastSuccessfulUpdate = if ($vmSuccess -eq $expectedRegions -and $vmFailed -eq 0 -and $vmOutcome -eq "success") { $now } else { Get-PreviousSourceUpdate $metadata "history" $metadata.lastUpdated }
              summary = "$vmSuccess of $expectedRegions region snapshots archived"
              failures = @("${{ steps.fetch.outputs.failed }}".Split(',', [System.StringSplitOptions]::RemoveEmptyEntries))
            },
            @{
              id = "cards"; label = "Top Trumps cards"
              status = if ($cardsOutcome -eq "success") { "success" } else { "unavailable" }
              checkedAt = $now
              lastSuccessfulUpdate = if ($cardsOutcome -eq "success") { $now } else { Get-PreviousSourceUpdate $metadata "cards" $metadata.lastUpdated }
              summary = if ($cardsOutcome -eq "success") { "Card deck generated" } else { "Card generation failed; last-known-good data retained" }
              failures = if ($cardsOutcome -eq "success") { @() } else { @("Card data generation") }
            }
          )

          $metadata.lastUpdated = $now
          $metadata.lastUpdatedDisplay = (Get-Date).ToString("MMMM yyyy")
          $metadata.availableRegions = @($config.targetRegions | ForEach-Object { $_.name } | Where-Object { Test-Path "data/$_.json" })
          $metadata.physicalRegionCount = if ($regionsCount -gt 0) { $regionsCount } else { $metadata.physicalRegionCount }
          $metadata.regionsWithData = $vmSuccess
          $metadata.failedRegions = @("${{ steps.fetch.outputs.failed }}".Split(',', [System.StringSplitOptions]::RemoveEmptyEntries))
          $metadata.sourceHealth = @{
            checkedAt = $now
            complete = -not [bool]($sources | Where-Object { $_.status -ne "success" })
            sources = $sources
          }
          $metadata | ConvertTo-Json -Depth 8 | Set-Content $metadataPath -Encoding UTF8
          Write-Host "[INFO] Source refresh health recorded: $(@($sources | Where-Object { $_.status -ne 'success' }).Count) source(s) incomplete or unavailable"
        shell: pwsh

      - name: Deploy to Azure Static Web Apps
        run: |
          # Build staging folder with only web-servable files
          $staging = "deploy-staging"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "index.html" "$staging/"
          if (Test-Path "toptrumps.html") { Copy-Item "toptrumps.html" "$staging/" }
          if (Test-Path "toptrumps-beta.html") { Copy-Item "toptrumps-beta.html" "$staging/" }
          if (Test-Path "azure-logo.png") { Copy-Item "azure-logo.png" "$staging/" }
          if (Test-Path "assets") { Copy-Item -Recurse "assets" "$staging/assets" }
          Copy-Item "config.json" "$staging/"
          Copy-Item -Recurse "data" "$staging/data"
          if (Test-Path "vendor") { Copy-Item -Recurse "vendor" "$staging/vendor" }

          npx --yes @azure/static-web-apps-cli deploy ./deploy-staging `
            --deployment-token ${{ secrets.SWA_DEPLOYMENT_TOKEN }} `
            --env production

          Remove-Item $staging -Recurse -Force
          Write-Host "[OK] Deployed to Azure Static Web Apps"
        shell: pwsh

      - name: Commit updated data to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add data/
          $changes = git diff --cached --name-only
          if ($changes) {
            git commit -m "chore: monthly VM SKU data refresh - $(Get-Date -Format 'MMMM yyyy')"
            git -c gc.auto=0 push
            Write-Host "[OK] Data committed and pushed"
          } else {
            Write-Host "[INFO] No data changes to commit"
          }
        shell: pwsh

      - name: Post workflow summary
        if: always()
        run: |
          $date = Get-Date -Format "dd MMMM yyyy HH:mm UTC"
          $success = "${{ steps.fetch.outputs.success_count }}"
          $fail = "${{ steps.fetch.outputs.fail_count }}"
          $available = "${{ steps.fetch.outputs.available }}"
          $failed = "${{ steps.fetch.outputs.failed }}"

          $summary = @"
          ## [REPORT] VM SKU Data Refresh Report
          **Date:** $date

          | Metric | Value |
          |--------|-------|
          | [OK] Regions updated | $success |
          | [FAIL] Regions failed | $fail |

          ### Regions Updated
          "@

          if ($available) {
            foreach ($r in $available.Split(',')) {
              $summary += "`n- [OK] ``$r``"
            }
          } else {
            $summary += "`n- _None_"
          }

          $summary += "`n`n### Regions Failed"
          if ($failed) {
            foreach ($r in $failed.Split(',')) {
              $summary += "`n- [FAIL] ``$r``"
            }
          } else {
            $summary += "`n- _None_ [NONE]"
          }

          $summary += "`n`n### Data Source Availability"
          if (Test-Path "data/metadata.json") {
            $metadata = Get-Content "data/metadata.json" -Raw | ConvertFrom-Json
            foreach ($source in $metadata.sourceHealth.sources) {
              $icon = if ($source.status -eq "success") { "[OK]" } elseif ($source.status -eq "partial") { "[WARN]" } else { "[FAIL]" }
              $summary += "`n- $icon **$($source.label):** $($source.summary)"
              if ($source.failures.Count -gt 0) {
                $summary += " — Failed: $($source.failures -join ', ')"
              }
            }
          } else {
            $summary += "`n- [FAIL] Source availability metadata unavailable"
          }

          $summary += "`n`n---`n_Notification recipient: darren.johns@microsoft.com_"
          $summary += "`n_To add/remove regions, edit ``config.json``_"

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "[OK] Workflow summary posted"
        shell: pwsh
